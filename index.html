<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Termostato</title>
    <!-- Linkando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <label for="temperatura">Temperatura:</label>
    <!-- Campo numérico iniciando em 30, com limite entre 0 e 70 -->
    <input type="number" id="temperatura" value="30" min="0" max="70">
    
    <button id="btnAtualizar">Atualizar</button>
    <span id="mensagemErro"></span>

    <!-- Retângulo -->
    <div id="retangulo"></div>

    <!-- Linkando o arquivo JS externo no final do body -->
    <script src="script.js"></script>
</body>
</html>
